# size = 模型【局部】尺寸 [局部x, 局部y, 高]，取自各模型实测：
#   official_bed             2.06 x 2.49 x 0.83   双人床（床头在 -X）
#   official_bed_single      1.05 x 2.00 x 0.62   单人床（床头在 +Y）
#   official_sofa            2.00 x 0.90 x 0.80   靠背在 +Y
#   official_dining_table    1.00 x 2.35 x 0.75   长轴沿局部 Y
#   official_dining_chair    0.40 x 0.53 x 0.96   靠背在 +Y
#   official_refrigerator    0.73 x 0.72 x 1.74
#   official_stove           0.69 x 0.97 x 1.03   Oven（含灶台）
#   official_kitchensink     0.79 x 0.76 x 0.92
#   official_standard_toilet 0.48 x 0.67 x 0.61   水箱在 +X
#   official_bathroomsink    0.51 x 0.46 x 0.32
#   official_wardrobe        1.25 x 0.65 x 2.00
#   official_cabinet         0.47 x 0.49 x 1.02
#   official_desk            0.49 x 0.84 x 0.55
#   official_chair           0.58 x 0.51 x 0.82
#   official_tvstand         1.60 x 0.44 x 0.45
#   official_cafe_table      0.91 x 0.91 x 0.78
#   official_room_armchair   0.70 x 0.71 x 0.68
#
# front 语义（决定 yaw）：south=0°(朝本地 -Y) / east=90° / north=180° / west=270°
#   front 为 east/west 时，世界 footprint 的 x/y 尺寸互换。
