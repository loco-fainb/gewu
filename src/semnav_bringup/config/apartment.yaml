nav_goals:
# 13 个房间各一个停靠点。选点判据（2026-10-21 第二轮，实测驱动）：
#   1) 净空 >= 0.55 m（车体直径 0.349 + 0.20 余量）—— 硬约束
#   2) 定位歧义度尽量高：360°/24 朝向下激光两两平均 L1 差，低 = 各朝向
#      看起来一样 = AMCL 分不出朝向 = 到位后控制器卡死
#   3) 开阔度（平均测距）尽量大
#   4) 与出生点同连通域、房间内缩 0.25 m
# 第一版只按「净空最大」选，几何全可达（check_reachability 13/13），但实测
# 5 个目标落在定位歧义区，卫生间(歧义0.970)走到 0.286 m 后卡死 165 s，
# AMCL 粒子坍缩，后续 4 个目标全 FAILED。本版把歧义度纳入评分。
# 仍偏低的两处是几何天花板（房间小、三面实墙），非选点不当：
#   次卧二 0.639（3.19x3.02 m）、西侧阳台 0.595（1.53x2.18 m）
