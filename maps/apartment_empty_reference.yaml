# ===========================================================================
# 轴网（mm）—— 参考图 20.3586 mm/px 像素实测，逐项与图注尺寸链吻合
#
#   x:  0 | 1530 | 3900 | 5110 | 9180 | 10440 | 12410 | 13630
#   y:  -1700 | 0 | 4060 | 4790 | 6240 | 7080 | 8340 | 9180
#
# ── 门洞实测依据（本次校正）───────────────────────────────────────────────
# 参考图内墙用中灰(G)绘制、外墙用纯黑(K)，两者都是墙。
#  a) x=5110 在 y[-0.45, 5.23] 连续实心 → 主卧东墙无门；
#     主卧门开在北墙 y=4060（实测该处地面为木色，缺口 x 3.92~4.98）
#  b) x=9180 在 y[-0.45, 5.86] 连续实心 → 次卧一西墙无门；
#     次卧一门开在北墙 y=4060（实测缺口 x 9.31~10.33）
#  c) y=6240 墙体横跨 x[1.374, 4.082] → 卫生间北墙【全实心，不向厨房开门】
#     卫生间只能从西臂（x=3900）进入
#  d) y=6240 缺口 x[0.112, 1.374] → 厨房↔西阳台 1.26 m 开口
#     y=6240 缺口 x[4.082, 4.896] → 厨房↔西臂 0.81 m 门
#  e) x=3900 缺口 y[5.54, 6.19] → 卫生间门（在东北端，非早前假设的 4.80）
#  f) x=1530 缺口 y[4.38, 5.19] → 卫生间↔西阳台 0.81 m 门
# ===========================================================================

